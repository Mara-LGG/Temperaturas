<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
     <link rel="stylesheet" href="./styles.css">
    <title>Temperaturas</title>
</head>

<body class="container">
 
    <p class="p">Ingresa la tempertura en grados Celsius para convertirla en Faherenheit y Kelvin:</p>
    <div class="input-group mb-3">
        <input id="celsiusInput" type="number" class="form-control" placeholder="Recipient’s celsius" aria-label="Recipient’s celsius"
            aria-describedby="button-addon2">
        <button id = "btn" class="btn btn-outline-secondary" type="button" id="button-addon2">Convertir</button>
    </div>

    <div class="card" style="width: 18rem;">
        <div class="card-body">
            <h5 class="card-title">Resultados</h5>
            <p class="card-text">Fahrenheit: <span id="fahrenheitResultado"></span></p>
            <p class="card-text">Kelvin: <span id="kelvinResultado"></span></p>
        </div>


    <script src="JS/temperaturas.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>

</html>
